name: Build OpenClaw

on:
  push:
    branches: ["backup3"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v6

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei Docker Hub einloggen
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bauen und Hochladen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/openclaw:latest
          build-args: |
            OPENCLAW_INSTALL_BROWSER=1
            OPENCLAW_IMAGE_APT_PACKAGES=ffmpeg gh imagemagick libsox-fmt-all poppler-utils sox
            OPENCLAW_IMAGE_PIP_PACKAGES=pypdf scenedetect-headless yt-dlp
